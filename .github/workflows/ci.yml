# The SDK's checks: its tests on PHP 8.1 and 8.5 and PHPStan at its highest level, on each
# push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PHP_OLDEST: php:8.1-cli-alpine@sha256:7949370448b0b4d9787776dc5968e0fd8d48763292344b5fbf21539441228a98
  PHP_NEWEST: php:8.5-cli-alpine@sha256:1ff5b45922ab30f418447c6089dbe2eba5f01e0b2742863d0327ac349305d70f
  PHPSTAN: ghcr.io/phpstan/phpstan:2-php8.5@sha256:61bce0b764be16b6985949b00769f774a47665742b5ba1e1032a6d6a07fbe0f7

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests on PHP 8.1 and 8.5
        run: |
          for image in "$PHP_OLDEST" "$PHP_NEWEST"; do
            docker run --rm --network=none -v "$PWD:/repo:ro" -w /repo "$image" sh -c \
              'for f in $(find src tests -name "*.php"); do php -l "$f" >/dev/null || exit 1; done; php tests/run.php' \
              || exit 1
          done
      - name: PHPStan
        run: |
          docker run --rm --network=none -v "$PWD:/repo:ro" -w /repo "$PHPSTAN" \
            analyse --no-progress --memory-limit=1G -c phpstan.neon
